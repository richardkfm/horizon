{% extends "base.html" %}
{% block title %}{{ article_title }} — {{ pack_title }} — horizon{% endblock %}
{% block content %}
<div class="reading-column">
<p class="breadcrumb no-print"><a href="/reference">Reference library</a> <span aria-hidden="true">/</span> <a href="/reference/{{ pack_id }}">{{ pack_title }}</a></p>

<form method="get" action="/reference/{{ pack_id }}" class="ask-form no-print" role="search">
  <label class="visually-hidden" for="reference-article-search">Search {{ pack_title }}</label>
  <input type="search" id="reference-article-search" name="q"
         placeholder="Search {{ pack_title }}…" />
  <button type="submit" class="ask-button">Search</button>
</form>
<p class="ask-aside no-print"><a href="/reference/{{ pack_id }}/random">Open a random article →</a></p>

<article class="zim-article">
  {{ body_html | safe }}
</article>
</div>
{% endblock %}
